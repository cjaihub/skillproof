{% extends "base.html" %}{% from "_macros.html" import csrf with context %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="auth card">
  <h1>Log in</h1>
  <form method="post" class="form">
    {{ csrf() }}
    <label>Email<input type="email" name="email" required autofocus autocomplete="email"></label>
    <label>Password<input type="password" name="password" required autocomplete="current-password"></label>
    <button class="btn btn-block">Log in</button>
  </form>
  <p class="muted center">New here? <a href="{{ url_for('register') }}">Create an account</a></p>
</div>
{% endblock %}
