name: Feature request
description: Suggest an improvement for candidates, assessors, employers or admins
labels: [enhancement]
body:
  - type: dropdown
    id: who
    attributes:
      label: Who is it for?
      multiple: true
      options: [Candidates, Assessors, Employers, Admins, Partner organisations, Developers]
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What is hard or impossible today? Real situations from refugee settings help most.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: This doesn't need new personal data, or I've explained why it does
